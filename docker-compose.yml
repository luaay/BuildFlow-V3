services:
  # قاعدة البيانات في حاوية
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - buildflow-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  # لوحة الرصد: تستقبل الآثار والسجلّات والمقاييس
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: buildflow-aspire-dashboard
    environment:
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured
    ports:
      - "18888:18888"
      - "18889:18889"
    restart: unless-stopped

  # تطبيق الواجهة في حاوية
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # سلسلتا الاتصال تشيران إلى حاوية قاعدة البيانات باسم خدمتها
      ConnectionStrings__IdentityDb: "Server=database;Database=BuildFlow;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__ProjectsDb: "Server=database;Database=BuildFlow;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__DocumentsDb: "Server=database;Database=BuildFlow;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"
      # وجهة الرصد: اسم الخدمة لا المضيف المحلّي، فالحاويات تتخاطب بأسمائها
      Otel__Endpoint: "http://aspire-dashboard:18889"
      # أسرار الرمز من متغيّرات البيئة
      Jwt__SecretKey: "${JWT_SECRET}"
      Jwt__Issuer: "BuildFlow"
      Jwt__Audience: "BuildFlow"
      Jwt__ExpiryMinutes: "60"
    depends_on:
      database:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    # المخزن المؤقّت
  redis:
    image: redis:7-alpine
    container_name: buildflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  buildflow-data: